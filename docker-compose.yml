services:
  nginx:
    image: nginx:alpine
    container_name: self-healing-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - monitoring

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: self-healing-blackbox
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: self-healing-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    depends_on:
      - blackbox-exporter
      - alertmanager
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:latest
    container_name: self-healing-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - monitoring

  recovery:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: self-healing-recovery
    environment:
      NGINX_CONTAINER: self-healing-nginx
    volumes:
      - ./ansible:/ansible:ro
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "5000"
    depends_on:
      - nginx
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge

